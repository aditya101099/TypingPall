name: Release & Notarize

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain Info
        run: xcodebuild -version

      - name: Validate practice library & lessons
        run: |
          python3 scripts/library.py build --check
          python3 scripts/library.py validate
          python3 scripts/check_lessons.py

      - name: Create Ephemeral Keychain & Import Developer ID
        if: env.BUILD_CERTIFICATE_BASE64 != ''
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o $RUNNER_TEMP/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import $RUNNER_TEMP/cert.p12 -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Archive, Sign & Notarize Universal Binary
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          if [ -n "$ASC_PRIVATE_KEY" ]; then
            echo -n "$ASC_PRIVATE_KEY" > $RUNNER_TEMP/AuthKey.p8
            xcodebuild archive \
              -scheme TypingPall \
              -destination "generic/platform=macOS" \
              -archivePath $RUNNER_TEMP/TypingPall.xcarchive \
              ARCHS="arm64 x86_64" \
              ONLY_ACTIVE_ARCH=NO \
              OTHER_CODE_SIGN_FLAGS="--timestamp --options=runtime"

            ditto -c -k --keepParent "$RUNNER_TEMP/TypingPall.xcarchive/Products/Applications/TypingPall.app" "$RUNNER_TEMP/TypingPall.zip"

            xcrun notarytool submit "$RUNNER_TEMP/TypingPall.zip" \
              --key "$RUNNER_TEMP/AuthKey.p8" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait

            xcrun stapler staple "$RUNNER_TEMP/TypingPall.xcarchive/Products/Applications/TypingPall.app"
          else
            echo "Signing secrets not configured. Creating unsigned Release binary."
            xcodebuild -project TypingPall.xcodeproj -scheme TypingPall \
              -configuration Release -destination 'generic/platform=macOS' \
              -derivedDataPath build/DerivedData ARCHS='arm64 x86_64' ONLY_ACTIVE_ARCH=NO \
              CODE_SIGNING_ALLOWED=NO build
          fi

      - name: Destroy Ephemeral Keychain & Secrets
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true
          rm -f $RUNNER_TEMP/cert.p12 $RUNNER_TEMP/AuthKey.p8
